name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_remote:
        description: Deploy images to the configured Docker Compose host
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Build and publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Derive lowercase image names
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/supply-chain-autopilot-api" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/supply-chain-autopilot-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:sha-${{ github.sha }}
            ${{ steps.images.outputs.backend }}:latest
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}:sha-${{ github.sha }}
            ${{ steps.images.outputs.frontend }}:latest

  deploy-compose:
    name: Deploy to Docker Compose host
    needs: images
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_remote
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Derive lowercase image names
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/supply-chain-autopilot-api" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/supply-chain-autopilot-web" >> "$GITHUB_OUTPUT"
      - name: Copy deployment manifest
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.production.yml
          target: ${{ secrets.DEPLOY_PATH }}
      - name: Apply release
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}:sha-${{ github.sha }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}:sha-${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            export BACKEND_IMAGE FRONTEND_IMAGE
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose --env-file .env.production -f docker-compose.production.yml pull
            docker compose --env-file .env.production -f docker-compose.production.yml up -d --remove-orphans
