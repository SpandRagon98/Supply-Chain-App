name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    name: Validate repository foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate repository structure
        run: |
          test -d backend
          test -d frontend
          test -d docs
          test -d infrastructure
          test -d scripts
          test -f README.md
          test -f .env.example
          test -f docker-compose.yml
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: supply_chain_test
          POSTGRES_USER: supply_chain
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supply_chain -d supply_chain_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app
      - name: Validate migrations
        env:
          DATABASE_URL: postgresql+asyncpg://supply_chain:test-only-password@localhost:5432/supply_chain_test
        run: |
          alembic heads
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Test
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://supply_chain:test-only-password@localhost:5432/supply_chain_test
        run: pytest

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end product journey
        run: npm run test:e2e
